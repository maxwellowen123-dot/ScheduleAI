<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScheduleAI</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#0b1020;
      color:white;
      text-align:center;
      padding:40px 20px;
    }
    .box{
      max-width:700px;
      margin:auto;
      background:#121a31;
      padding:30px;
      border-radius:20px;
    }
    h1{
      font-size:48px;
      margin-bottom:10px;
    }
    p{
      color:#b5bfd8;
    }
    textarea{
      width:100%;
      height:120px;
      margin-top:20px;
      padding:15px;
      border-radius:12px;
      border:none;
      font-size:16px;
      box-sizing:border-box;
    }
    button{
      margin-top:15px;
      padding:14px 22px;
      border:none;
      border-radius:12px;
      background:#8fa8ff;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>ScheduleAI</h1>
    <p>Tell AI what you want scheduled and add it to your calendar.</p>

    <textarea placeholder="Example: Dentist tomorrow at 3 PM for 1 hour"></textarea>

    <button>Add to Calendar</button>
  </div>
</body>
</html>
